name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
      - name: Install Windows 7-compatible Go toolchain
        run: |
          ./scripts/install-go-win7.sh "$RUNNER_TEMP/go-win7"
          echo "GOROOT=$RUNNER_TEMP/go-win7" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/go-win7/bin" >> "$GITHUB_PATH"
      - name: Install UPX for OpenWrt
        run: |
          ./scripts/install-upx.sh "$RUNNER_TEMP/upx"
          echo "$RUNNER_TEMP/upx/upx-5.3.0-amd64_linux" >> "$GITHUB_PATH"
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
