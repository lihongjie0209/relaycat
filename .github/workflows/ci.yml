name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - run: go test -race -count=1 -tags=integration ./...
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-setup-action@v1.50.0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - run: buf lint
      - run: buf generate && git diff --exit-code -- gen

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - run: go test -run '^$' -bench . -benchmem -benchtime=100ms ./internal/accesscode ./internal/tunnelcrypto
      - run: go test -run '^$' -tags=integration -bench EndToEnd -benchmem -benchtime=100ms ./internal/endpoint

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go build ./cmd/relaycat

  windows-7-build:
    strategy:
      fail-fast: false
      matrix:
        arch: [386, amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache: true
      - name: Install Windows 7-compatible Go toolchain
        run: |
          ./scripts/install-go-win7.sh "$RUNNER_TEMP/go-win7"
      - name: Build Windows 7 binary
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.arch }}
          GOOS: windows
          GOROOT: ${{ runner.temp }}/go-win7
        run: |
          "$GOROOT/bin/go" build -trimpath -o "relaycat_windows_${GOARCH}.exe" ./cmd/relaycat
