version: 2
project_name: relaycat
builds:
  - id: relaycat-unix
    main: ./cmd/relaycat
    binary: relaycat
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/lihongjie0209/relaycat/internal/cli.Version={{.Version}}
      - -X github.com/lihongjie0209/relaycat/internal/cli.Commit={{.Commit}}
      - -X github.com/lihongjie0209/relaycat/internal/cli.Date={{.Date}}
  - id: relaycat-windows
    main: ./cmd/relaycat
    binary: relaycat
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [386, amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/lihongjie0209/relaycat/internal/cli.Version={{.Version}}
      - -X github.com/lihongjie0209/relaycat/internal/cli.Commit={{.Commit}}
      - -X github.com/lihongjie0209/relaycat/internal/cli.Date={{.Date}}
  - id: relaycat-openwrt-mipsle
    main: ./cmd/relaycat
    binary: relaycat
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [mipsle]
    gomips: [softfloat]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/lihongjie0209/relaycat/internal/cli.Version={{.Version}}
      - -X github.com/lihongjie0209/relaycat/internal/cli.Commit={{.Commit}}
      - -X github.com/lihongjie0209/relaycat/internal/cli.Date={{.Date}}
  - id: relaycat-openwrt-mipsle-upx
    main: ./cmd/relaycat
    binary: relaycat
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [mipsle]
    gomips: [softfloat]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/lihongjie0209/relaycat/internal/cli.Version={{.Version}}
      - -X github.com/lihongjie0209/relaycat/internal/cli.Commit={{.Commit}}
      - -X github.com/lihongjie0209/relaycat/internal/cli.Date={{.Date}}
    hooks:
      post:
        - ./scripts/pack-openwrt.sh "{{ .Path }}"
  - id: relaycat-linux-arm64-upx
    main: ./cmd/relaycat
    binary: relaycat
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/lihongjie0209/relaycat/internal/cli.Version={{.Version}}
      - -X github.com/lihongjie0209/relaycat/internal/cli.Commit={{.Commit}}
      - -X github.com/lihongjie0209/relaycat/internal/cli.Date={{.Date}}
    hooks:
      post:
        - ./scripts/pack-openwrt.sh "{{ .Path }}"
archives:
  - id: standard
    ids: [relaycat-unix, relaycat-windows]
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: openwrt
    ids: [relaycat-openwrt-mipsle]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
  - id: openwrt-upx
    ids: [relaycat-openwrt-mipsle-upx]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_upx"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
  - id: linux-arm64-upx
    ids: [relaycat-linux-arm64-upx]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_upx"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
    ids: [standard, openwrt]
changelog:
  sort: asc
